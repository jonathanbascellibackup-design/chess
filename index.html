<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Chess Self-Play Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin-top: 30px; }
        #board { width: 400px; margin: 15px auto; }
        #status { font-size: 15px; font-weight: bold; color: #333; margin-top: 10px; }
        #moves { font-size: 13px; color: #666; max-width: 400px; margin: 10px auto; word-break: break-all; }
    </style>
</head>
<body>

    <h1>Scacchiera in Tempo Reale (Self-Play AI)</h1>
    <div id="board"></div>
    <div id="status">In attesa di connessione all'API...</div>
    <div id="moves">Mosse giocate: </div>

    <script>
        let apiUrl = prompt("Inserisci l'URL dell'API FEN (es. http://localhost:5001/fen):", "http://localhost:5001/fen");
        if (!apiUrl) { apiUrl = "http://localhost:5001/fen"; }

        var board = Chessboard('board', {
            position: 'start',
            draggable: false
        });

        function updateBoard() {
            $.getJSON(apiUrl)
                .done(function(data) {
                    // Decifra il JSON strutturato inviato dall'API Python
                    if (data && data.fen) {
                        board.position(data.fen);
                        $('#status').text("Ultima mossa: " + (data.last_move || "Nessuna") + " | FEN: " + data.fen);
                        if (data.moves) {
                            $('#moves').text("Cronologia mosse: " + data.moves.join(", "));
                        }
                    }
                })
                .fail(function() {
                    $('#status').text("Errore di connessione a " + apiUrl);
                });
        }

        // Aggiorna la scacchiera ogni secondo
        setInterval(updateBoard, 1000);
    </script>

</body>
</html>
